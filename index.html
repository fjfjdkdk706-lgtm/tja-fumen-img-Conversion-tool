<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>譜面画像 to TJA コンバーター</title>
  <style>
    :root {
      --primary-color: #e64a19;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.8rem;
    }
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 6px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: border-color 0.3s;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary-color);
      background: #fff8f6;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #d84315;
    }
    .output-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    textarea {
      width: 100%;
      height: 450px;
      font-family: monospace;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      white-space: pre;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>譜面画像 to TJA コンバーター</h1>
  <p>太鼓の達人の譜面画像を読み込んで全小節の解析を行い、.tja ファイルテキストを出力します。</p>

  <div class="drop-zone" id="dropZone">
    画像をドラッグ＆ドロップするか、クリックしてファイルを選択
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>

  <div class="controls">
    <button id="convertBtn" disabled>TJAに全自動変換</button>
    <button id="downloadBtn" disabled>ファイル保存 (.tja)</button>
  </div>

  <div class="output-group">
    <label for="tjaOutput"><strong>生成された TJA コード:</strong></label>
    <textarea id="tjaOutput" placeholder="変換実行後、ここに全小節のTJAコードが表示されます..." readonly></textarea>
  </div>
</div>

<canvas id="workCanvas"></canvas>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const tjaOutput = document.getElementById('tjaOutput');
  const canvas = document.getElementById('workCanvas');
  const ctx = canvas.getContext('2d');

  let currentImage = null;

  // --- UI イベント処理 ---
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) loadImage(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) loadImage(e.target.files[0]);
  });

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        dropZone.innerText = `読み込み完了: ${file.name}`;
        convertBtn.disabled = false;
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  // --- 色・要素判定ロジック ---
  function getNoteType(r, g, b, isLarge) {
    if (r > 180 && g < 110 && b < 110) return isLarge ? '3' : '1'; // 赤（ドン/大）
    if (r < 110 && g > 130 && b > 200) return isLarge ? '4' : '2'; // 青（カッ/大）
    if (r > 200 && g > 170 && b < 110) return '5';                  // 黄（連打）
    return '0'; // 休符
  }

  function isGogoBackground(r, g, b) {
    return (r > 220 && g > 170 && b > 170 && g < 210); // ピンク色背景
  }

  // --- 画像全自動解析メイン処理 ---
  function analyzeChartImage(ctx, width, height) {
    const lines = [];
    
    // ヘッダー構文
    lines.push("TITLE: 銀の黎明か、黒の晶華か。");
    lines.push("SUBTITLE: --かめりあ vs t+pazolite");
    lines.push("BPM: 305");
    lines.push("WAVE: 銀の黎明か、黒の晶華か。_normalized.ogg");
    lines.push("OFFSET: -0.775748");
    lines.push("DEMOSTART: 93.6282");
    lines.push("\nCOURSE: Edit");
    lines.push("LEVEL: 10");
    lines.push("BALLOON: 3,6\n");
    lines.push("#START");

    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;

    // 1. レーン（グレーの帯）のY座標列を取得
    const laneYPositions = [];
    for (let y = 0; y < height - 10; y += 4) {
      let grayCount = 0;
      for (let x = 50; x < width - 50; x += 20) {
        const idx = (y * width + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        if (Math.abs(r - g) < 12 && Math.abs(g - b) < 12 && r > 70 && r < 150) {
          grayCount++;
        }
      }
      if (grayCount > (width - 100) / 20 * 0.6) {
        if (laneYPositions.length === 0 || y - laneYPositions[laneYPositions.length - 1] > 20) {
          laneYPositions.push(y);
        }
      }
    }

    let isGogoActive = false;

    // 2. レーン毎の小節スキャン
    laneYPositions.forEach((laneY) => {
      // 白い小節線を検出
      const barXPositions = [];
      for (let x = 5; x < width - 5; x++) {
        const idx = (laneY * width + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        if (r > 220 && g > 220 && b > 220) {
          if (barXPositions.length === 0 || x - barXPositions[barXPositions.length - 1] > 15) {
            barXPositions.push(x);
          }
        }
      }

      // 各小節のノーツとギミック判定
      for (let i = 0; i < barXPositions.length - 1; i++) {
        const startX = barXPositions[i];
        const endX = barXPositions[i + 1];
        const measureWidth = endX - startX;

        if (measureWidth < 30) continue;

        // ゴーゴータイムの判定
        const midX = Math.floor(startX + measureWidth / 2);
        const bgIdx = ((laneY - 18) * width + midX) * 4;
        const isGogoNow = isGogoBackground(data[bgIdx], data[bgIdx+1], data[bgIdx+2]);

        if (isGogoNow && !isGogoActive) {
          lines.push("#GOGOSTART");
          isGogoActive = true;
        } else if (!isGogoNow && isGogoActive) {
          lines.push("#GOGOEND");
          isGogoActive = false;
        }

        // 小節内の音符分解能（デフォルト16分割）
        const division = 16;
        let measureStr = "";
        const step = measureWidth / division;

        for (let d = 0; d < division; d++) {
          const checkX = Math.floor(startX + step * d + step / 2);
          const idx = (laneY * width + checkX) * 4;
          const r = data[idx], g = data[idx+1], b = data[idx+2];

          const topIdx = ((laneY - 6) * width + checkX) * 4;
          const isLarge = (Math.abs(data[topIdx] - r) < 20);

          measureStr += getNoteType(r, g, b, isLarge);
        }

        lines.push(measureStr + ",");
      }
    });

    lines.push("#END");
    return lines.join("\n");
  }

  // --- 変換ボタンのクリック処理 ---
  convertBtn.addEventListener('click', () => {
    if (!currentImage) return;

    canvas.width = currentImage.width;
    canvas.height = currentImage.height;
    ctx.drawImage(currentImage, 0, 0);

    const resultTja = analyzeChartImage(ctx, currentImage.width, currentImage.height);

    tjaOutput.value = resultTja;
    downloadBtn.disabled = false;
  });

  // --- ファイルダウンロード処理 ---
  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([tjaOutput.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chart.tja';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
