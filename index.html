<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>譜面画像 to TJA 全音符対応コンバーター</title>
  <style>
    :root {
      --primary-color: #e64a19;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.8rem;
    }
    .meta-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
      background: #fafafa;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-group label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
    }
    .input-group input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 6px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: border-color 0.3s;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary-color);
      background: #fff8f6;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #d84315;
    }
    .output-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    textarea {
      width: 100%;
      height: 480px;
      font-family: monospace;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      white-space: pre;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>譜面画像 to TJA 全音符対応コンバーター</h1>
  <p>あらゆる音符（8/12/16/20/24/32/48/64/96/192分音符等）の組み合わせを自動判定して解析します。</p>

  <div class="meta-inputs">
    <div class="input-group">
      <label for="metaTitle">曲名 (TITLE)</label>
      <input type="text" id="metaTitle" value="銀の黎明か、黒の晶華か。">
    </div>
    <div class="input-group">
      <label for="metaSubtitle">サブタイトル (SUBTITLE)</label>
      <input type="text" id="metaSubtitle" value="--かめりあ vs t+pazolite">
    </div>
    <div class="input-group">
      <label for="metaBpm">BPM</label>
      <input type="text" id="metaBpm" value="305">
    </div>
    <div class="input-group">
      <label for="metaWave">音源名 (WAVE)</label>
      <input type="text" id="metaWave" value="銀の黎明か、黒の晶華か。_normalized.ogg">
    </div>
    <div class="input-group">
      <label for="metaCourse">難易度 (COURSE)</label>
      <input type="text" id="metaCourse" value="Edit">
    </div>
    <div class="input-group">
      <label for="metaLevel">レベル (LEVEL)</label>
      <input type="text" id="metaLevel" value="10">
    </div>
  </div>

  <div class="drop-zone" id="dropZone">
    譜面画像をドラッグ＆ドロップ、またはクリックして選択
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>

  <div class="controls">
    <button id="convertBtn" disabled>全音符自動解析を実行</button>
    <button id="downloadBtn" disabled>tjaファイルを保存</button>
  </div>

  <div class="output-group">
    <label for="tjaOutput"><strong>生成された TJA コード:</strong></label>
    <textarea id="tjaOutput" placeholder="解析結果がここに表示されます..." readonly></textarea>
  </div>
</div>

<canvas id="workCanvas"></canvas>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const tjaOutput = document.getElementById('tjaOutput');
  const canvas = document.getElementById('workCanvas');
  const ctx = canvas.getContext('2d');

  let currentImage = null;

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) loadImage(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) loadImage(e.target.files[0]);
  });

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        dropZone.innerText = `読み込み完了: ${file.name}`;
        convertBtn.disabled = false;
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function getPixelHSV(data, width, x, y) {
    const idx = (Math.floor(y) * width + Math.floor(x)) * 4;
    const r = data[idx], g = data[idx+1], b = data[idx+2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    const s = max === 0 ? 0 : d / max;
    const v = max / 255;

    if (max !== min) {
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    return { h: h * 360, s, v, r, g, b };
  }

  function identifyNoteType(hsv, isLarge) {
    if (hsv.s > 0.45 && hsv.v > 0.35) {
      if (hsv.h < 25 || hsv.h > 330) return isLarge ? '3' : '1';
      if (hsv.h > 170 && hsv.h < 250) return isLarge ? '4' : '2';
      if (hsv.h >= 30 && hsv.h <= 70)  return '5';
    }
    return '0';
  }

  function parseChartFromImageData(ctx, width, height) {
    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;

    const laneYPositions = [];
    for (let y = 10; y < height - 10; y += 3) {
      let grayPixelCount = 0;
      const samples = 40;
      for (let i = 0; i < samples; i++) {
        const x = (width / samples) * i + 10;
        const p = getPixelHSV(data, width, x, y);
        if (Math.abs(p.r - p.g) < 15 && Math.abs(p.g - p.b) < 15 && p.r > 70 && p.r < 150) {
          grayPixelCount++;
        }
      }
      if (grayPixelCount > samples * 0.7) {
        if (laneYPositions.length === 0 || y - laneYPositions[laneYPositions.length - 1] > 20) {
          laneYPositions.push(y);
        }
      }
    }

    const balloonCounts = [];
    const chartBodyLines = [];
    let isGogoActive = false;
    let activeRoll = false;

    // 対応可能なすべての分割数リスト（4分〜192分音符まで網羅）
    const candidateDivisions = [4, 8, 12, 16, 20, 24, 32, 36, 40, 48, 64, 72, 96, 128, 192];

    laneYPositions.forEach((laneY) => {
      const barXPositions = [];
      for (let x = 5; x < width - 5; x++) {
        const p = getPixelHSV(data, width, x, laneY);
        if (p.r > 220 && p.g > 220 && p.b > 220) {
          if (barXPositions.length === 0 || x - barXPositions[barXPositions.length - 1] > 15) {
            barXPositions.push(x);
          }
        }
      }

      for (let i = 0; i < barXPositions.length - 1; i++) {
        const startX = barXPositions[i];
        const endX = barXPositions[i + 1];
        const measureWidth = endX - startX;
        if (measureWidth < 30) continue;

        const midX = startX + measureWidth / 2;
        const bgP = getPixelHSV(data, width, midX, laneY - 18);
        const isGogoNow = (bgP.r > 200 && bgP.g > 150 && bgP.b > 160 && (bgP.r - bgP.g > 20));

        if (isGogoNow && !isGogoActive) {
          chartBodyLines.push("#GOGOSTART");
          isGogoActive = true;
        } else if (!isGogoNow && isGogoActive) {
          chartBodyLines.push("#GOGOEND");
          isGogoActive = false;
        }

        const rawNotes = [];
        for (let x = startX + 2; x < endX - 2; x += 2) {
          const p = getPixelHSV(data, width, x, laneY);
          const topP = getPixelHSV(data, width, x, laneY - 7);
          const isLarge = (topP.s > 0.4 && Math.abs(topP.h - p.h) < 20);
          const note = identifyNoteType(p, isLarge);

          if (note !== '0') {
            const relPos = (x - startX) / measureWidth;
            rawNotes.push({ pos: relPos, type: note });
          }
        }

        const detectedNotes = [];
        rawNotes.forEach(n => {
          if (detectedNotes.length === 0) {
            detectedNotes.push(n);
          } else {
            const last = detectedNotes[detectedNotes.length - 1];
            if (Math.abs(n.pos - last.pos) > 0.015 || n.type !== last.type) {
              detectedNotes.push(n);
            }
          }
        });

        // --- 全音符対応：最小全方位フィッティングアルゴリズム ---
        let division = 16;
        if (detectedNotes.length > 0) {
          for (const div of candidateDivisions) {
            // すべてのノーツの位置誤差が6%未満におさまる最小の分割数を選択
            const fits = detectedNotes.every(note => {
              const exactPos = note.pos * div;
              const error = Math.abs(exactPos - Math.round(exactPos));
              return error < 0.06;
            });
            if (fits) {
              division = div;
              break;
            }
          }
        }

        const measureArray = new Array(division).fill('0');
        detectedNotes.forEach(note => {
          const index = Math.min(division - 1, Math.max(0, Math.round(note.pos * division)));
          let type = note.type;

          if (type === '5') {
            if (!activeRoll) {
              type = '5';
              activeRoll = true;
              balloonCounts.push(5);
            } else {
              type = '0';
            }
          } else if (activeRoll) {
            measureArray[Math.max(0, index - 1)] = '8';
            activeRoll = false;
          }
          measureArray[index] = type;
        });

        chartBodyLines.push(measureArray.join('') + ",");
      }
    });

    const title = document.getElementById('metaTitle').value;
    const subtitle = document.getElementById('metaSubtitle').value;
    const bpm = document.getElementById('metaBpm').value;
    const wave = document.getElementById('metaWave').value;
    const course = document.getElementById('metaCourse').value;
    const level = document.getElementById('metaLevel').value;

    const header = [
      `TITLE:${title}`,
      `SUBTITLE:${subtitle}`,
      `BPM:${bpm}`,
      `WAVE:${wave}`,
      ``,
      `COURSE:${course}`,
      `LEVEL:${level}`,
      `BALLOON:${balloonCounts.join(',')}`,
      `SCOREINIT:`,
      `SCOREDIFF:`,
      ``,
      `#START`
    ];

    return header.concat(chartBodyLines, ["#END"]).join("\n");
  }

  convertBtn.addEventListener('click', () => {
    if (!currentImage) return;

    canvas.width = currentImage.width;
    canvas.height = currentImage.height;
    ctx.drawImage(currentImage, 0, 0);

    const resultTja = parseChartFromImageData(ctx, currentImage.width, currentImage.height);

    tjaOutput.value = resultTja;
    downloadBtn.disabled = false;
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([tjaOutput.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chart.tja';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
