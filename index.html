<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>譜面画像 to TJA 全自動解析コンバーター</title>
  <style>
    :root {
      --primary-color: #e64a19;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.8rem;
    }
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 6px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: border-color 0.3s;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary-color);
      background: #fff8f6;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #d84315;
    }
    .output-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    textarea {
      width: 100%;
      height: 480px;
      font-family: monospace;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      white-space: pre;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>譜面画像 to TJA 全自動解析コンバーター</h1>
  <p>ファイルをドロップするだけで、曲名の取得からノーツ・小節・連打（BALLOON）の解析まで全自動で処理します。</p>

  <div class="drop-zone" id="dropZone">
    譜面画像をドラッグ＆ドロップ、またはクリックして選択
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>

  <div class="controls">
    <button id="convertBtn" disabled>再解析を実行</button>
    <button id="downloadBtn" disabled>tjaファイルを保存</button>
  </div>

  <div class="output-group">
    <label for="tjaOutput"><strong>生成された TJA コード:</strong></label>
    <textarea id="tjaOutput" placeholder="画像を読み込むと自動的にメタデータ取得とノーツ解析が行われます..." readonly></textarea>
  </div>
</div>

<canvas id="workCanvas"></canvas>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const tjaOutput = document.getElementById('tjaOutput');
  const canvas = document.getElementById('workCanvas');
  const ctx = canvas.getContext('2d');

  let currentImage = null;
  let autoTitle = "New Song";

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) loadImage(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) loadImage(e.target.files[0]);
  });

  function loadImage(file) {
    // ファイル名から曲名を自動取得（拡張子を除去）
    autoTitle = file.name.replace(/\.[^/.]+$/, "");
    
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        dropZone.innerText = `読み込み完了: ${file.name}`;
        convertBtn.disabled = false;
        
        // 画像読み込み後、自動で解析処理を実行
        executeAnalysis();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function getPixelHSV(data, width, x, y) {
    const px = Math.min(width - 1, Math.max(0, Math.floor(x)));
    const py = Math.min(data.length / (width * 4) - 1, Math.max(0, Math.floor(y)));
    const idx = (py * width + px) * 4;
    
    const r = data[idx], g = data[idx+1], b = data[idx+2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    const s = max === 0 ? 0 : d / max;
    const v = max / 255;

    if (max !== min) {
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    return { h: h * 360, s, v, r, g, b };
  }

  function identifyNoteType(hsv) {
    // 判定条件を広げて様々な画像・配色に対応
    if (hsv.s > 0.35 && hsv.v > 0.30) {
      if (hsv.h < 30 || hsv.h > 330) return '1'; // 赤 (ドン)
      if (hsv.h > 160 && hsv.h < 250) return '2'; // 青 (カッ)
      if (hsv.h >= 35 && hsv.h <= 75)  return '5'; // 黄 (連打/風船)
    }
    return '0';
  }

  function parseChartFromImageData(ctx, width, height) {
    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;

    // 1. レーン位置の自動検出（画像全体からノーツ色の密度が高いY座標を探す）
    const rowColorDensity = new Array(height).fill(0);
    for (let y = 0; y < height; y += 2) {
      let colorCount = 0;
      for (let x = 0; x < width; x += 4) {
        const p = getPixelHSV(data, width, x, y);
        if (identifyNoteType(p) !== '0') {
          colorCount++;
        }
      }
      rowColorDensity[y] = colorCount;
    }

    const laneYPositions = [];
    for (let y = 5; y < height - 5; y++) {
      if (rowColorDensity[y] > 5 && 
          rowColorDensity[y] >= rowColorDensity[y-1] && 
          rowColorDensity[y] >= rowColorDensity[y+1]) {
        if (laneYPositions.length === 0 || y - laneYPositions[laneYPositions.length - 1] > 18) {
          laneYPositions.push(y);
        }
      }
    }

    // レーンが検出できない場合の自動均等分割フォールバック
    if (laneYPositions.length === 0) {
      const estimatedLanes = 4;
      for (let i = 0; i < estimatedLanes; i++) {
        laneYPositions.push(Math.floor((height / (estimatedLanes + 1)) * (i + 1)));
      }
    }

    const balloonCounts = [];
    const chartBodyLines = [];
    let isGogoActive = false;
    let activeRoll = false;

    const candidateDivisions = [4, 8, 12, 16, 20, 24, 32, 48, 64];

    // 2. 各レーンごとに小節区切り線およびノーツを自動スキャン
    laneYPositions.forEach((laneY) => {
      const barXPositions = [];
      for (let x = 2; x < width - 2; x++) {
        const p = getPixelHSV(data, width, x, laneY);
        // 区切り線（白・グレー）の検出
        if ((p.r > 180 && p.g > 180 && p.b > 180) || (Math.abs(p.r - p.g) < 10 && p.r > 120 && p.r < 200)) {
          if (barXPositions.length === 0 || x - barXPositions[barXPositions.length - 1] > 20) {
            barXPositions.push(x);
          }
        }
      }

      // 小節線が検出できない場合は横幅から自動分割
      if (barXPositions.length < 2) {
        const defaultMeasures = 4;
        barXPositions.length = 0;
        for (let i = 0; i <= defaultMeasures; i++) {
          barXPositions.push(Math.floor((width / defaultMeasures) * i));
        }
      }

      for (let i = 0; i < barXPositions.length - 1; i++) {
        const startX = barXPositions[i];
        const endX = barXPositions[i + 1];
        const measureWidth = endX - startX;
        if (measureWidth < 20) continue;

        // ゴーゴータイムの自動判定
        const midX = startX + measureWidth / 2;
        const bgP = getPixelHSV(data, width, midX, Math.max(0, laneY - 15));
        const isGogoNow = (bgP.r > 180 && bgP.g > 120 && bgP.b < 180 && bgP.r > bgP.b + 30);

        if (isGogoNow && !isGogoActive) {
          chartBodyLines.push("#GOGOSTART");
          isGogoActive = true;
        } else if (!isGogoNow && isGogoActive) {
          chartBodyLines.push("#GOGOEND");
          isGogoActive = false;
        }

        // ノーツスキャン
        const rawNotes = [];
        for (let x = startX; x < endX; x += 2) {
          const p = getPixelHSV(data, width, x, laneY);
          const type = identifyNoteType(p);

          if (type !== '0') {
            const relPos = (x - startX) / measureWidth;
            rawNotes.push({ pos: relPos, type: type });
          }
        }

        // ノーツ重複クラスタリング
        const detectedNotes = [];
        rawNotes.forEach(n => {
          if (detectedNotes.length === 0) {
            detectedNotes.push(n);
          } else {
            const last = detectedNotes[detectedNotes.length - 1];
            if (Math.abs(n.pos - last.pos) > 0.02 || n.type !== last.type) {
              detectedNotes.push(n);
            }
          }
        });

        // 小節分割数の動的決定
        let division = 16;
        if (detectedNotes.length > 0) {
          for (const div of candidateDivisions) {
            const fits = detectedNotes.every(note => {
              const exactPos = note.pos * div;
              return Math.abs(exactPos - Math.round(exactPos)) < 0.12;
            });
            if (fits) {
              division = div;
              break;
            }
          }
        }

        // TJA文字生成
        const measureArray = new Array(division).fill('0');
        detectedNotes.forEach(note => {
          const index = Math.min(division - 1, Math.max(0, Math.round(note.pos * division)));
          let type = note.type;

          if (type === '5') {
            if (!activeRoll) {
              type = '5';
              activeRoll = true;
              balloonCounts.push(5);
            } else {
              type = '0';
            }
          } else if (activeRoll) {
            measureArray[Math.max(0, index - 1)] = '8';
            activeRoll = false;
          }
          measureArray[index] = type;
        });

        chartBodyLines.push(measureArray.join('') + ",");
      }
    });

    // 3. ヘッダー情報の自動作成 (WAVE項目削除、タイトル自動反映)
    const header = [
      `TITLE:${autoTitle}`,
      `SUBTITLE:--`,
      `BPM:120`,
      `COURSE:Edit`,
      `LEVEL:10`,
      `BALLOON:${balloonCounts.join(',')}`,
      `SCOREINIT:`,
      `SCOREDIFF:`,
      ``,
      `#START`
    ];

    return header.concat(chartBodyLines, ["#END"]).join("\n");
  }

  function executeAnalysis() {
    if (!currentImage) return;

    canvas.width = currentImage.width;
    canvas.height = currentImage.height;
    ctx.drawImage(currentImage, 0, 0);

    const resultTja = parseChartFromImageData(ctx, currentImage.width, currentImage.height);

    tjaOutput.value = resultTja;
    downloadBtn.disabled = false;
  }

  convertBtn.addEventListener('click', executeAnalysis);

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([tjaOutput.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${autoTitle}.tja`;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
