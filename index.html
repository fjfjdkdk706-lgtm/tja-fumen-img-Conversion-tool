<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>譜面画像 to TJA コンバーター</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
    .drop-zone { border: 2px dashed #ccc; padding: 40px; text-align: center; cursor: pointer; background: #fafafa; }
    .drop-zone:hover { border-color: #f44336; }
    .controls { margin: 15px 0; display: flex; gap: 10px; }
    button { padding: 10px 20px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    textarea { width: 100%; height: 350px; font-family: monospace; padding: 10px; box-sizing: border-box; }
    canvas { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>譜面画像 to TJA コンバーター</h1>
  
  <div class="drop-zone" id="dropZone">
    画像をドラッグ＆ドロップするか、クリックして選択
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>

  <div class="controls">
    <button id="convertBtn" disabled>TJAに変換</button>
    <button id="downloadBtn" disabled>tjaファイルを保存</button>
  </div>

  <textarea id="tjaOutput" placeholder="変換結果がここに表示されます..." readonly></textarea>
</div>

<canvas id="workCanvas"></canvas>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const tjaOutput = document.getElementById('tjaOutput');
  const canvas = document.getElementById('workCanvas');
  const ctx = canvas.getContext('2d');

  let currentImage = null;

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => e.preventDefault());
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length > 0) loadImage(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) loadImage(e.target.files[0]);
  });

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        dropZone.innerText = `読み込み完了: ${file.name}`;
        convertBtn.disabled = false;
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ============================================================
  // ★ ここにJavaScript解析ロジック（関数群）を配置します ★
  // ============================================================

  // 1. メイン解析関数
  function parseChartImage(imageCanvas) {
    const ctx = imageCanvas.getContext('2d');
    const width = imageCanvas.width;
    const height = imageCanvas.height;

    let tjaLines = [];
    
    // ヘッダー部分（画像のタイトル・BPM等に合わせて動的に拡張可能）
    tjaLines.push("TITLE: 銀の黎明か、黒の晶華か。");
    tjaLines.push("SUBTITLE: --かめりあ vs t+pazolite");
    tjaLines.push("BPM: 305");
    tjaLines.push("WAVE: 銀の黎明か、黒の晶華か。_normalized.ogg");
    tjaLines.push("OFFSET: -0.775748");
    tjaLines.push("DEMOSTART: 93.6282");
    tjaLines.push("\nCOURSE: Edit");
    tjaLines.push("LEVEL: 10");
    tjaLines.push("BALLOON: 3,6\n");
    tjaLines.push("#START");

    // レーンや小節の解析処理を実行（ロジックの呼び出し）
    const parsedMeasures = analyzeImageGrid(ctx, width, height);
    tjaLines = tjaLines.concat(parsedMeasures);

    tjaLines.push("#END");
    return tjaLines.join("\n");
  }

  // 2. グリッドとノーツの検出（解析処理の本体）
  function analyzeImageGrid(ctx, width, height) {
    let lines = [];
    
    // 現時点では基本処理の流れのサンプル（拡張用の枠組み）
    // 実際の実装では、ここでCanvasのgetImageDataを使い
    // レーン位置・背景色(ピンク)・ノーツの色(赤/青/黄)を走査します。
    
    lines.push("#GOGOSTART");
    lines.push("4000300040001122,");
    lines.push("2000300040001222,");
    lines.push("20304034,");
    lines.push("0010202022222111,");
    lines.push("#GOGOEND");
    lines.push("100000222111,");

    return lines;
  }

  // ============================================================
  // ★ ボタンを押したときの実行処理 ★
  // ============================================================
  convertBtn.addEventListener('click', () => {
    if (!currentImage) return;

    // 読み込んだ画像をCanvasに描画
    canvas.width = currentImage.width;
    canvas.height = currentImage.height;
    ctx.drawImage(currentImage, 0, 0);

    // 解析関数の実行
    const resultTja = parseChartImage(canvas);

    // テキストエリアに出力
    tjaOutput.value = resultTja;
    downloadBtn.disabled = false;
  });

  // ダウンロード処理
  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([tjaOutput.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chart.tja';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
