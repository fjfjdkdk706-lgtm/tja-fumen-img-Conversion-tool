<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太鼓譜面画像 ➔ TJA 変換器</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --card-bg: #2b2b36;
      --accent-color: #ff4757;
      --text-color: #f1f2f6;
      --border-color: #3f3f4e;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .drop-zone {
      border: 2px dashed var(--accent-color);
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s;
    }
    .drop-zone:hover {
      background: rgba(255, 71, 87, 0.1);
    }
    input[type="file"] { display: none; }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #a4b0be;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #1e1e24;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { opacity: 0.9; }
    textarea {
      width: 100%;
      height: 400px;
      background: #1e1e24;
      color: #7bed9f;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: monospace;
      padding: 10px;
      box-sizing: border-box;
      white-space: pre;
    }
    canvas { display: none; }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #eccc68;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>太鼓譜面画像 ➔ TJA 変換ツール</h1>

  <div class="grid">
    <!-- 設定・入力エリア -->
    <div class="card">
      <h3>1. 画像読み込み & 設定</h3>
      <div class="drop-zone" id="dropZone">
        ここに太鼓wikiなどの譜面画像をドラッグ＆ドロップ<br>またはクリックして選択
        <input type="file" id="fileInput" accept="image/*">
      </div>
      <div class="status" id="statusMsg">画像を選択してください</div>

      <h4 style="margin-top: 20px;">基本ヘッダー情報</h4>
      <div class="input-group">
        <label>曲名 (TITLE)</label>
        <input type="text" id="titleInput" value="タイトル未設定">
      </div>
      <div class="input-group">
        <label>BPM</label>
        <input type="number" id="bpmInput" value="140">
      </div>
      <div class="input-group">
        <label>1小節あたりの分割分解能 (標準は16分=16)</label>
        <input type="number" id="resolutionInput" value="16">
      </div>

      <button id="convertBtn" disabled>TJAに変換実行</button>
    </div>

    <!-- 出力エリア -->
    <div class="card">
      <h3>2. TJA出力結果</h3>
      <textarea id="tjaOutput" placeholder="ここに生成されたTJAコードが表示されます..."></textarea>
      <button id="downloadBtn">.tjaファイルをダウンロード</button>
    </div>
  </div>
</div>

<canvas id="workCanvas"></canvas>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const statusMsg = document.getElementById('statusMsg');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const tjaOutput = document.getElementById('tjaOutput');
  const canvas = document.getElementById('workCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  let loadedImage = null;

  // ファイル選択イベント
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleImage(e.target.files[0]));

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(255, 71, 87, 0.2)'; });
  dropZone.addEventListener('dragleave', () => dropZone.style.background = '');
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.background = '';
    if (e.dataTransfer.files.length) handleImage(e.dataTransfer.files[0]);
  });

  function handleImage(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        statusMsg.textContent = `読み込み完了: ${img.width} x ${img.height} px`;
        convertBtn.disabled = false;
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  // 変換メイン処理
  convertBtn.addEventListener('click', () => {
    if (!loadedImage) return;

    canvas.width = loadedImage.width;
    canvas.height = loadedImage.height;
    ctx.drawImage(loadedImage, 0, 0);

    const width = canvas.width;
    const height = canvas.height;
    const imgData = ctx.getImageData(0, 0, width, height);

    statusMsg.textContent = "解析中...";

    setTimeout(() => {
      const tjaText = processChartImage(imgData, width, height);
      tjaOutput.value = tjaText;
      statusMsg.textContent = "変換が完了しました！";
    }, 50);
  });

  function processChartImage(imgData, w, h) {
    const data = imgData.data;

    // 1. 横線（レーン上下境界）を自動検出
    let laneRows = [];
    for (let y = 0; y < h; y++) {
      let blackCount = 0;
      for (let x = 0; x < w; x++) {
        const idx = (y * w + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        if (r < 30 && g < 30 && b < 30) blackCount++;
      }
      if (blackCount > w * 0.4) laneRows.push(y);
    }

    // レーンの上下線をペアリング (高さ約25~35pxの区間)
    let lanes = [];
    for (let i = 0; i < laneRows.length - 1; i++) {
      let diff = laneRows[i+1] - laneRows[i];
      if (diff >= 25 && diff <= 35) {
        lanes.push({ top: laneRows[i], bottom: laneRows[i+1], midY: Math.floor((laneRows[i] + laneRows[i+1])/2) });
        i++; // ペアをスキップ
      }
    }

    let resGrid = parseInt(document.getElementById('resolutionInput').value) || 16;
    let title = document.getElementById('titleInput').value;
    let bpm = document.getElementById('bpmInput').value;

    let tjaLines = [
      `TITLE:${title}`,
      `BPM:${bpm}`,
      `WAVE:track.ogg`,
      `OFFSET:0.0`,
      ``,
      `#START`
    ];

    let isGoGo = false;

    // 2. 各レーン（行）の小節・ノーツを走査
    lanes.forEach((lane) => {
      // ゴーゴータイム判定 (背景のピンク色検出)
      let headerIdx = (lane.top - 5) * w * 4;
      if (headerIdx > 0 && headerIdx < data.length) {
        let gr = data[headerIdx], gg = data[headerIdx+1], gb = data[headerIdx+2];
        let currentlyGoGo = (gr > 230 && gg < 200 && gb < 210);
        if (currentlyGoGo && !isGoGo) {
          tjaLines.push("#GOGOSTART");
          isGoGo = true;
        } else if (!currentlyGoGo && isGoGo) {
          tjaLines.push("#GOGOEND");
          isGoGo = false;
        }
      }

      // 縦の小節線（白色線）を探す
      let measureX = [];
      for (let x = 0; x < w; x++) {
        let whiteCount = 0;
        for (let y = lane.top; y <= lane.bottom; y++) {
          let idx = (y * w + x) * 4;
          if (data[idx] > 220 && data[idx+1] > 220 && data[idx+2] > 220) whiteCount++;
        }
        if (whiteCount > (lane.bottom - lane.top) * 0.8) {
          if (measureX.length === 0 || x - measureX[measureX.length - 1] > 30) {
            measureX.push(x);
          }
        }
      }

      // 小節ごとにグリッドサンプルしてノーツ判定
      for (let m = 0; m < measureX.length - 1; m++) {
        let startX = measureX[m];
        let endX = measureX[m+1];
        let mWidth = endX - startX;
        let measureStr = "";

        for (let g = 0; g < resGrid; g++) {
          let sampleX = Math.floor(startX + (g + 0.5) * (mWidth / resGrid));
          let note = detectNoteAt(imgData, w, sampleX, lane.midY);
          measureStr += note;
        }
        tjaLines.push(measureStr + ",");
      }
    });

    if (isGoGo) tjaLines.push("#GOGOEND");
    tjaLines.push("#END");

    return tjaLines.join("\n");
  }

  // 指定座標のノーツ種別判定関数
  function detectNoteAt(imgData, width, cx, cy) {
    const data = imgData.data;
    let red = 0, blue = 0, yellow = 0, total = 0;
    let rMaxRadius = 0;

    // 半径10pxの範囲の色を走査
    for (let dy = -10; dy <= 10; dy++) {
      for (let dx = -10; dx <= 10; dx++) {
        let x = cx + dx;
        let y = cy + dy;
        let idx = (y * width + x) * 4;

        if (idx >= 0 && idx < data.length) {
          let r = data[idx], g = data[idx+1], b = data[idx+2];
          total++;

          // 色判定 (ドン=赤, カッ=青, 連打=黄)
          if (r > 200 && g < 100 && b < 100) {
            red++;
            rMaxRadius = Math.max(rMaxRadius, Math.hypot(dx, dy));
          } else if (r < 100 && g > 130 && b > 200) {
            blue++;
            rMaxRadius = Math.max(rMaxRadius, Math.hypot(dx, dy));
          } else if (r > 200 && g > 180 && b < 100) {
            yellow++;
          }
        }
      }
    }

    // 閾値判定
    if (red / total > 0.15) {
      return rMaxRadius > 7.5 ? "3" : "1"; // 3:大ドン, 1:小ドン
    } else if (blue / total > 0.15) {
      return rMaxRadius > 7.5 ? "4" : "2"; // 4:大カッ, 2:小カッ
    } else if (yellow / total > 0.25) {
      return "5"; // 5:連打
    }
    return "0"; // 0:休符
  }

  // TJAファイルダウンロード処理
  downloadBtn.addEventListener('click', () => {
    const text = tjaOutput.value;
    if (!text) return;

    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    const title = document.getElementById('titleInput').value || 'chart';
    link.download = `${title}.tja`;
    link.click();
  });
</script>
</body>
</html>
