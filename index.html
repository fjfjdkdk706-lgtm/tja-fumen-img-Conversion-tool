<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>譜面画像 to TJA コンバーター</title>
  <style>
    :root {
      --primary-color: #e64a19;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.8rem;
    }
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 6px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: border-color 0.3s;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary-color);
      background: #fff8f6;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #d84315;
    }
    .output-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    textarea {
      width: 100%;
      height: 300px;
      font-family: monospace;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>譜面画像 to TJA コンバーター</h1>
  <p>太鼓の達人風の譜面画像をアップロードして .tja ファイル形式のテキストを出力します。</p>

  <div class="drop-zone" id="dropZone">
    画像をドラッグ＆ドロップするか、クリックしてファイルを選択
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>

  <div class="controls">
    <button id="convertBtn" disabled>TJAに変換</button>
    <button id="downloadBtn" disabled>ファイル保存 (.tja)</button>
  </div>

  <div class="output-group">
    <label for="tjaOutput"><strong>生成された TJA コード:</strong></label>
    <textarea id="tjaOutput" placeholder="変換結果がここに表示されます..." readonly></textarea>
  </div>
</div>

<canvas id="workCanvas"></canvas>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const tjaOutput = document.getElementById('tjaOutput');
  const canvas = document.getElementById('workCanvas');
  const ctx = canvas.getContext('2d');

  let currentImage = null;

  // --- イベントハンドラ ---
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      loadImage(e.dataTransfer.files[0]);
    }
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      loadImage(e.target.files[0]);
    }
  });

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        dropZone.innerText = `読み込み完了: ${file.name}`;
        convertBtn.disabled = false;
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  // --- ピクセルの色からノーツ種別を判定 ---
  function getNoteType(r, g, b, radius) {
    // 赤系 (ドン / 大ドン)
    if (r > 180 && g < 100 && b < 100) {
      return radius > 10 ? '3' : '1';
    }
    // 青系 (カッ / 大カッ)
    if (r < 100 && g > 150 && b > 200) {
      return radius > 10 ? '4' : '2';
    }
    // 黄色系 (連打)
    if (r > 200 && g > 200 && b < 100) {
      return '5';
    }
    return '0'; // 休符
  }

  // --- 変換ロジック ---
  convertBtn.addEventListener('click', () => {
    if (!currentImage) return;

    canvas.width = currentImage.width;
    canvas.height = currentImage.height;
    ctx.drawImage(currentImage, 0, 0);

    // ヘッダー基本構文の初期化
    let tjaContent = "TITLE: 魔宵月（裏譜面）\nBPM: 105\nWAVE:\nDEMOSTART:\nSIDE: 3\n\nCOURSE: Oni\nLEVEL: 10\nBALLOON:\nSCOREINIT:\nSCOREDIFF:\n\n#START\n";

    /*
      注: 本格的な画像読み取りにはOpenCV.jsを用いた小節線（グリッド）と円（ノーツ）の自動検出が必要です。
      ここではベースロジックとしてCanvasのピクセル走査構造を定義しています。
    */

    // 擬似的に出力フォーマットを組むロジック（拡張ポイント）
    const dummyMeasures = [
      "10201020,",
      "10102020,",
      "30401020,",
      "50000008,"
    ];

    tjaContent += dummyMeasures.join("\n") + "\n#END";

    tjaOutput.value = tjaContent;
    downloadBtn.disabled = false;
  });

  // --- ダウンロード処理 ---
  downloadBtn.addEventListener('click', () => {
    const text = tjaOutput.value;
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chart.tja';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
